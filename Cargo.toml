[package]
name = "iec104-workbench"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform IEC 60870-5-104 test client with a GUI"
license = "Apache-2.0"
repository = "https://github.com/Project-Stateful-Zenith/iec104-workbench"
authors = ["Project-Stateful-Zenith Contributors"]
keywords = ["iec104", "scada", "test", "gui", "iec-60870-5-104"]
categories = ["network-programming", "gui"]

[dependencies]
iec104 = { git = "https://github.com/Project-Stateful-Zenith/zenith-iec104", tag = "v0.35.0" }
iec104-tokio = { git = "https://github.com/Project-Stateful-Zenith/zenith-iec104", tag = "v0.35.0" }
iec104-tls = { git = "https://github.com/Project-Stateful-Zenith/zenith-iec104", tag = "v0.35.0", features = ["tokio"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.33"
egui_extras = "0.33"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1"
tokio = { version = "1.54", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
rcgen = "0.14"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
